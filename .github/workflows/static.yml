# Builds the site from exocean/content/*.json and publishes it to GitHub Pages.
#
# Runs on every push to main (a content edit goes live about a minute later),
# and every Monday morning on its own: that scheduled run first refreshes the
# publication list from HAL and the latest Bluesky posts (posts tagged
# #exoceannews become news items), commits them if they changed, then rebuilds
# and publishes. Nobody has to touch anything.
#
# Each run also makes light WebP copies of the photos (optimise_images.py) and
# prints the one-page Services summary to PDF with Chrome. Neither is committed:
# they are rebuilt for every deploy.

name: Build and deploy exocean

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'      # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write             # the weekly run commits refreshed content
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (for the lighter copies of the photos)
        run: pip install --quiet pillow

      - name: Reuse the photo copies made by earlier runs
        uses: actions/cache@v4
        with:
          path: exocean/assets/img/w
          key: photos-${{ hashFiles('exocean/assets/img/*') }}
          restore-keys: photos-

      - name: Refresh publications (HAL) and Bluesky posts
        if: github.event_name != 'push'
        working-directory: exocean
        run: |
          python3 fetch_hal.py || echo "HAL refresh skipped"
          python3 fetch_bluesky.py || echo "Bluesky refresh skipped"

      - name: Make lighter copies of the photos
        working-directory: exocean
        run: python3 optimise_images.py

      - name: Generate HTML from content/
        working-directory: exocean
        run: python3 build.py

      - name: Print the one-page Services summary (PDF)
        continue-on-error: true      # the site deploys anyway, just without the PDF link
        working-directory: exocean
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/dev/null 2>&1 &
          server=$!
          sleep 2
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf-no-header \
            --virtual-time-budget=10000 --print-to-pdf=assets/exocean-services.pdf \
            http://127.0.0.1:8123/capabilities.html
          kill $server || true
          python3 build.py >/dev/null   # again, so the Services page links the PDF

      - name: Commit refreshed content
        if: github.event_name != 'push'
        run: |
          git config user.name "exocean site bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A exocean
          if ! git diff --cached --quiet; then
            git commit -m "Weekly refresh: publications and Bluesky posts"
            git push
          else
            # GitHub switches scheduled workflows off after 60 days without a
            # commit. If nothing has changed for 45 days, leave a tiny one.
            last=$(git log -1 --format=%ct)
            if [ $(( ($(date +%s) - last) / 86400 )) -ge 45 ]; then
              date -u +"%Y-%m-%d" > exocean/content/last-refresh.txt
              git add exocean/content/last-refresh.txt
              git commit -m "Scheduled check-in (keeps the weekly refresh enabled)"
              git push
            fi
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # re-enables Pages if it was ever switched off (e.g. after a private/public flip)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: './exocean'

      - id: deployment
        uses: actions/deploy-pages@v4
